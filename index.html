<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Order Flow Chart — Footprint / Volume / Volume Profile</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#10141c; --line:#1c2330; --text:#dbe1ea; --dim:#6b7688;
    --buy:#2fc98a; --sell:#e2495e; --accent:#4fa3ff; --poc:#ffd60a; --warn:#f5c451;
    --grid:rgba(255,255,255,0.05); --wick:#48505f; --cellborder:rgba(255,255,255,0.08);
    --tooltipbg:rgba(16,20,28,.96); --input-bg:#0d1119; --btn-bg:#171d2a; --active-text:#04101f;
  }
  html[data-theme="light"]{
    --bg:#ffffff; --panel:#f3f5f8; --line:#dfe3ea; --text:#1b2330; --dim:#7b8494;
    --buy:#1a9c66; --sell:#d43a52; --accent:#2f6fed; --poc:#d69f00; --warn:#b3790c;
    --grid:rgba(20,26,38,0.07); --wick:#9aa4b3; --cellborder:rgba(20,26,38,0.10);
    --tooltipbg:rgba(255,255,255,.97); --input-bg:#ffffff; --btn-bg:#eef1f5; --active-text:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:12px;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  #mainRow{flex:1;display:flex;min-height:0;}
  #leftCol{flex:1;display:flex;flex-direction:column;min-width:0;}

  #toolbar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:10.5px;}
  .lbl{color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-right:3px;}
  select,input[type=number],input[type=text]{background:var(--input-bg);color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:3px 6px;font-family:inherit;font-size:10.5px;}
  input[type=text]{width:76px;text-transform:uppercase;}
  button{background:var(--btn-bg);color:var(--text);border:1px solid var(--line);border-radius:5px;
    padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
  button:hover{border-color:var(--accent);}
  .tfbtns{display:flex;gap:2px;background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:2px;}
  .tfbtns button{border:none;background:transparent;border-radius:4px;padding:4px 9px;}
  .tfbtns button.active{background:var(--accent);color:var(--active-text);font-weight:700;}

  .drawToolbar{display:flex;align-items:center;gap:3px;padding-right:9px;margin-right:3px;border-right:1px solid var(--line);}
  .dtool{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;
    border:1px solid transparent;border-radius:5px;color:var(--text);cursor:pointer;padding:0;}
  .dtool svg{width:15px;height:15px;display:block;pointer-events:none;}
  .dtool:hover{border-color:var(--line);background:var(--btn-bg);}
  .dtool.active{background:var(--accent);color:var(--active-text);border-color:var(--accent);}
  .dtool-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
  .dtool-clear{color:var(--dim);}
  .dtool-clear:hover{color:var(--sell);border-color:var(--sell);background:transparent;}

  .draw-select-menu{position:absolute;display:none;gap:3px;background:var(--tooltipbg);border:1px solid var(--line);
    border-radius:7px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:25;}
  .draw-select-menu button{width:26px;height:26px;padding:0;font-size:13px;border-radius:5px;background:transparent;
    border:1px solid transparent;color:var(--text);}
  .draw-select-menu button:hover{border-color:var(--accent);}
  .draw-select-menu button.locked{color:var(--warn);}
  #status{margin-left:auto;display:flex;align-items:center;gap:10px;}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--sell);}
  #dot.live{background:var(--buy);box-shadow:0 0 6px var(--buy);}
  #dot.loading{background:var(--warn);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #lastPrice{font-weight:700;font-size:14px;}

  #progressWrap{height:3px;background:var(--line);display:none;}
  #progressBar{height:100%;background:var(--accent);width:0%;transition:width .15s;}
  #banner{display:none;padding:5px 14px;background:rgba(245,196,81,.1);color:var(--warn);
    border-bottom:1px solid var(--line);font-size:11px;}

  #chartHost{flex:1;position:relative;background:var(--bg);}
  #chartCanvas{position:absolute;inset:0;cursor:crosshair;}
  #tooltip{position:absolute;pointer-events:none;background:var(--tooltipbg);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.6;display:none;z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;}
  #tooltip b{color:var(--text);}
  #emptyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:13px;z-index:15;pointer-events:none;}

  #statsBar{display:flex;gap:16px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);
    color:var(--dim);font-size:10.5px;flex-wrap:wrap;}
  #statsBar b{color:var(--text);font-weight:800;}

</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <div class="drawToolbar" id="drawToolbar">
      <button class="dtool" data-tool="trend" title="Trend Line">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="3" cy="12.2" r="1.35"/><circle cx="12.6" cy="3.2" r="1.35"/><line x1="4.2" y1="11" x2="11.4" y2="4.4" stroke-linecap="round"/></svg>
      </button>
      <button class="dtool" data-tool="hline" title="Horizontal Ray">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="2.6" cy="8" r="1.25" fill="currentColor" stroke="none"/><line x1="5" y1="8" x2="14.2" y2="8"/></svg>
      </button>
      <button class="dtool" data-tool="line" title="Line">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2.6" y1="13" x2="13" y2="2.6"/></svg>

      </button>

      <button class="dtool dtool-clear" id="clearDrawBtn" title="Xoá tất cả nét vẽ">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10"/><path d="M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5"/><path d="M4.3 4.5l.6 8.2a1.3 1.3 0 0 0 1.3 1.2h3.6a1.3 1.3 0 0 0 1.3-1.2l.6-8.2"/></svg>
      </button>
    </div>
    <div><span class="lbl">Symbol</span>
      <select id="symbolSel">
        <option value="BTCUSDT">BTC/USDT</option>
      </select>

    <div><span class="lbl">TF</span>
      <div class="tfbtns" id="tfBtns">
        <button data-v="60000">1m</button>

    <div><span class="lbl">Tick</span><input type="number" id="tickInput" value="10" step="any" style="width:72px"></div>

      <select id="histSel"><option value="60" selected>60</option><option value="100">100</option>
        <option value="150">150</option><option value="250">250</option>
        <option value="500">500</option><option value="1000">1000</option></select>
    </div>
    <div>
      <button id="fitBtn">Fit</button>

    </div>
    <div id="status"><span id="statusText">Khởi tạo…</span><span id="lastPrice">—</span><span id="dot"></span></div>
  </div>



  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="banner"></div>

  <div id="mainRow">
  <div id="leftCol">
  <div id="chartHost">
    <canvas id="chartCanvas"></canvas>
    <div id="tooltip"></div>
    <div id="drawSelectMenu" class="draw-select-menu">
      <button id="dsmLock" title="Khóa">🔒</button>
      <button id="dsmDelete" title="Xóa">🗑️</button>
    </div>

  </div>

  <div id="statsBar">
    <span>Nến: <b id="stCandles">0</b></span>
    <span>Buy Vol: <b id="stBuy" style="color:var(--buy)">0</b></span>
    <span>Sell Vol: <b id="stSell" style="color:var(--sell)">0</b></span>
    <span>Net Delta: <b id="stDelta">0</b></span>
    <span>Trades: <b id="stTrades">0</b></span>
  </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* =========================================================================================
   1. DATA ENGINE — MEXC FUTURES.
   Lịch sử (candle body: open/high/low/close) lấy từ Kline CHÍNH THỨC của sàn (luôn đủ, không
   thiếu khung nào, kể cả lúc thị trường im ắng) — không còn dựng lại từ từng lệnh khớp như
   trước, nên không còn hiện tượng nến "chạy lẻ tẻ/đứt quãng" nữa.
   Footprint (khối lượng mua/bán theo từng mức giá) CHỈ có cho các nến TỪ LÚC MỞ TRANG TRỞ ĐI,
   dựng từ WebSocket lệnh khớp thật (JSON thuần, không phải Protobuf như bên Spot) — MEXC Futures
   không có endpoint public nào trả lệnh khớp sâu quá 100 lệnh gần nhất, nên không thể có
   footprint cho lịch sử xa hơn — đây là giới hạn thật của MEXC, không phải thiếu sót của code.
   ========================================================================================= */
const FUTURES_WS_URL = 'wss://contract.mexc.com/edge';

// Futures dùng ký hiệu có gạch dưới (BTC_USDT) khác Spot (BTCUSDT). Symbol người dùng chọn/gõ
// vẫn hiển thị kiểu Spot cho quen mắt — hàm này tự quy đổi sang định dạng Futures khi gọi API.
function toFuturesSymbol(sym){
  const s = (sym||'').toUpperCase();
  if (s.includes('_')) return s;
  const QUOTES = ['USDT','USDC','FDUSD','BUSD','BTC','ETH'];
  for (const q of QUOTES){ if (s.endsWith(q) && s.length>q.length) return s.slice(0, s.length-q.length)+'_'+q; }
  return s; // không đoán được quote asset -> để nguyên, MEXC sẽ trả lỗi rõ ràng thay vì âm thầm sai
}

const DE = {
  symbol:'BTCUSDT', intervalMs:300000, tickSize:10, historyCandles:60,
  restAvailable:true, session:0,
  candles:[],             // finalized, oldest->newest: {start,open,high,low,close,levels:Map(price->{bid,ask}),totalVol}
  candleIndex:new Map(),  // bucketStart(ms) -> candle object cùng tham chiếu với candles/live, tra cứu O(1)
  live:null,
  liveTrades:[],          // {p,q,isSell,T} — CHỈ lệnh khớp thật nhận qua WebSocket/mồi-deals kể từ khi kết nối,
                          // dùng để dựng lại footprint khi người dùng đổi Tick size, không cần tải lại mạng
  liveStartTime:0,        // mốc bucket đầu tiên có dữ liệu lệnh khớp thật — trước mốc này là nến kline thuần
  backfillDone:false,
  fillBudget:200000,      // trần TỔNG số nến "phẳng" lấp khoảng trống WS mất kết nối tạm thời (phòng hiệu năng)
  ws:null, wsPingTimer:null, wsReconnectTimer:null,
  tradeCount:0,
  seenTradeKeys:new Set(), seenTradeOrder:[], // chống đếm trùng lệnh khớp giữa REST mồi và WS
  onUpdate:null, onStatus:null, onBanner:null, onProgress:null,
  tickAuto:true, // chưa bị người dùng tự chỉnh Tick -> tự đề xuất tick size hợp lý theo giá mỗi symbol
};

function levelKey(price){ return Math.round(price/DE.tickSize)*DE.tickSize; }

function newCandle(bucketStart, price){
  // volFromKline=false: nến này KHÔNG có sẵn tổng volume từ Kline (dựng hoàn toàn từ lệnh khớp
  // thật nhận được) -> totalVol phải tự cộng dồn từng lệnh qua applyLiveCandle(). Nến dựng từ
  // Kline (trong backfill()) sẽ tự ghi đè cờ này thành true ngay sau khi tạo.
  return { start:bucketStart, open:price, high:price, low:price, close:price, levels:new Map(), totalVol:0, volFromKline:false };
}
function applyLevelOnly(c, price, qty, isSellAggressor){
  const lvl=levelKey(price);
  if (!c.levels.has(lvl)) c.levels.set(lvl,{bid:0,ask:0});
  const rec=c.levels.get(lvl);
  // isSellAggressor === true  -> taker sold -> hit BID  -> counts as SELL volume
  // isSellAggressor === false -> taker bought -> hit ASK -> counts as BUY volume
  if (isSellAggressor) rec.bid+=qty; else rec.ask+=qty;
}
// Tổng khối lượng "đáng tin" nhất để HIỂN THỊ cho 1 nến: nếu đã có dữ liệu footprint (tổng
// bid+ask theo từng mức giá) thì dùng số đó (chính xác tuyệt đối vì mỗi lệnh khớp chỉ được cộng
// đúng 1 lần); nếu số đó còn thấp hơn totalVol gốc từ Kline (ví dụ nến vừa mở trang đã có sẵn hàng
// trăm lệnh khớp trước đó mà MEXC không cho tải lại quá 100 lệnh gần nhất) thì lấy số lớn hơn làm
// mốc tổng, để không bao giờ hiển thị tổng THẤP HƠN thực tế đã biết từ Kline.
function candleVolume(c){
  let buy=0, sell=0;
  for (const r of c.levels.values()){ buy+=r.ask; sell+=r.bid; }
  const sum = buy+sell;
  return { buy, sell, total: Math.max(sum, c.totalVol||0) };
}
// Cập nhật nến ĐANG CHẠY (live, chưa chốt): OHLC luôn phải theo lệnh khớp mới nhất (đúng cho cả
// nến mới tinh lẫn nến vừa "mồi" từ Kline, vì nó vẫn đang tiếp diễn). totalVol thì CHỈ cộng dồn khi
// nến không có sẵn volume gốc từ Kline — nến có volFromKline=true đã có tổng đúng tính tới lúc tải
// rồi, cộng thêm nữa từ từng lệnh khớp mồi/WS sẽ bị ĐẾM TRÙNG (lệnh đó vốn đã nằm trong số của
// Kline). Hiển thị dùng candleVolume() ở trên nên không cần cộng dồn thủ công ở đây nữa.
function applyLiveCandle(c, price, qty, isSellAggressor){
  c.high=Math.max(c.high,price); c.low=Math.min(c.low,price); c.close=price;
  if (!c.volFromKline) c.totalVol+=qty;
  applyLevelOnly(c, price, qty, isSellAggressor);
}
// Bổ sung footprint cho nến ĐÃ CHỐT (lệnh khớp "mồi"/tới trễ rơi vào 1 khung thời gian đã đóng
// trước đó). CHỈ được thêm vào levels (buy/sell theo mức giá) — TUYỆT ĐỐI không đụng tới
// open/high/low/close/totalVol, vì các giá trị đó đã CHỐT CỨNG và đúng 100% từ Kline chính thức;
// để 1 lệnh khớp lẻ tẻ "viết đè" lại close/high/low của nến đã đóng sẽ làm sai chart đã vẽ đúng.
function applyFinalizedCandle(c, price, qty, isSellAggressor){
  applyLevelOnly(c, price, qty, isSellAggressor);
}
function addTrade(price, qty, isSellAggressor, tradeTime){
  const bucketStart = Math.floor(tradeTime/DE.intervalMs)*DE.intervalMs;
  if (!DE.live){ DE.live = newCandle(bucketStart, price); DE.candleIndex.set(bucketStart, DE.live); }
  else if (bucketStart > DE.live.start){
    // Lấp các khung intervalMs không có lệnh khớp nào ở giữa (WS bị rớt tạm thời, mạng chậm...)
    // bằng nến "phẳng" (open=high=low=close=giá đóng cửa nến trước, volume=0), để mỗi index
    // trong mảng luôn đúng 1 khung thời gian thật — không bị "nhảy cóc" khi vẽ theo index.
    const prevClose = DE.live.close;
    DE.candles.push(DE.live);
    const MAX_FILL = 5000; // chặn an toàn cho MỘT lần gọi
    let filled = 0;
    for (let t = DE.live.start + DE.intervalMs; t < bucketStart && filled < MAX_FILL && DE.fillBudget > 0; t += DE.intervalMs, filled++, DE.fillBudget--){
      const filler = newCandle(t, prevClose);
      DE.candles.push(filler); DE.candleIndex.set(t, filler);
    }
    DE.live = newCandle(bucketStart, price);
    DE.candleIndex.set(bucketStart, DE.live);
  }
  else if (bucketStart < DE.live.start){
    let target = DE.candleIndex.get(bucketStart);
    if (!target){ target=newCandle(bucketStart, price); DE.candles.push(target); DE.candles.sort((a,b)=>a.start-b.start); DE.candleIndex.set(bucketStart, target); }
    applyFinalizedCandle(target, price, qty, isSellAggressor); return;
  }
  applyLiveCandle(DE.live, price, qty, isSellAggressor);
}
function resetModel(){
  DE.candles=[]; DE.live=null; DE.candleIndex=new Map();
  DE.backfillDone=false; DE.fillBudget=200000;
  DE.liveTrades=[]; DE.liveStartTime=0;
  DE.seenTradeKeys=new Set(); DE.seenTradeOrder=[]; DE.tradeCount=0;
}
// Một số API trả timestamp bằng GIÂY thay vì mili-giây — 1e12 là ngưỡng phân biệt an toàn (mili-giây
// hiện tại ~1.7*10^12, giây hiện tại chỉ ~1.7*10^9), tự quy đổi để không lệch bucket nến.
function normalizeTradeTime(t){
  if (!isFinite(t)) return Date.now();
  return t < 1e12 ? t*1000 : t;
}
// Chống lệnh khớp bị đếm 2 LẦN — có thể xảy ra khi lệnh khớp "mồi" tải qua REST (contractDeals)
// trùng với lệnh khớp đầu tiên nhận qua WebSocket ngay sau đó (khoảng thời gian giao nhau giữa lúc
// chụp REST và lúc WS bắt đầu stream). Khoá nhận diện = giá+khối lượng+phe+thời điểm; dùng Set có
// giới hạn kích thước (không cần chính xác tuyệt đối lâu dài, chỉ cần chặn trùng ở giai đoạn mồi).
const MAX_SEEN_TRADES = 4000;
function tradeKey(price, qty, isSellAggressor, T){ return T+'|'+price+'|'+qty+'|'+(isSellAggressor?1:0); }
function ingestTrade(price, qty, isSellAggressor, rawT){
  if (!isFinite(price) || !isFinite(qty) || qty<=0) return false;
  const T = normalizeTradeTime(rawT);
  const key = tradeKey(price, qty, isSellAggressor, T);
  if (DE.seenTradeKeys.has(key)) return false; // lệnh khớp trùng — bỏ qua, không cộng dồn lần 2
  DE.seenTradeKeys.add(key); DE.seenTradeOrder.push(key);
  if (DE.seenTradeOrder.length>MAX_SEEN_TRADES){ const old=DE.seenTradeOrder.shift(); DE.seenTradeKeys.delete(old); }
  DE.liveTrades.push({p:price,q:qty,isSell:isSellAggressor,T});
  if (DE.liveTrades.length>50000) DE.liveTrades.splice(0, DE.liveTrades.length-50000);
  addTrade(price, qty, isSellAggressor, T);
  DE.tradeCount++;
  return true;
}
// Đổi Tick size KHÔNG cần tải lại mạng — chỉ cần gom lại footprint (buy/sell theo mức giá) của
// các nến ĐÃ CÓ dữ liệu lệnh khớp thật (từ liveTrades), không đụng tới OHLC (vẫn đúng nguyên vẹ từ
// kline). Nến lịch sử thuần kline (trước DE.liveStartTime) không có gì để gom lại — giữ nguyên.
function rebuildLiveFootprint(){
  const affected = new Set();
  if (DE.live) affected.add(DE.live);
  if (DE.liveStartTime){ for (const c of DE.candles) if (c.start>=DE.liveStartTime) affected.add(c); }
  for (const c of affected) c.levels = new Map();
  for (const t of DE.liveTrades){
    const c = DE.candleIndex.get(Math.floor(t.T/DE.intervalMs)*DE.intervalMs);
    if (c) applyLevelOnly(c, t.p, t.q, t.isSell);
  }
}

async function fetchJson(url, timeoutMs=10000){
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if (res.status===429 || res.status===418){
      const ra=parseInt(res.headers.get('Retry-After')||'2',10);
      await new Promise(r=>setTimeout(r, ra*1000));
      throw new Error('rate-limited-retry');
    }
    if (!res.ok){
      let bodyText=''; try{ bodyText = await res.text(); }catch(_e){}
      console.error(`[fetchJson] HTTP ${res.status} từ ${url}${bodyText?(' — body: '+bodyText.slice(0,500)):''}`);
      throw new Error('HTTP '+res.status);
    }
    return await res.json();
  } catch(e){
    if (e && e.name==='AbortError'){
      console.error(`[fetchJson] timeout sau ${timeoutMs}ms: ${url}`);
    } else if (e && e.message!=='rate-limited-retry' && !/^HTTP \d+$/.test(e.message||'')){
      console.error(`[fetchJson] lỗi network: ${url}`, e);
    }
    throw e;
  } finally { clearTimeout(timer); }
}

// Dự phòng khi không lấy được tick size chuẩn từ sàn — đoán 1 tick "vừa mắt" theo độ lớn giá.
function suggestTickSize(price){
  if (!isFinite(price) || price<=0) return 10;
  const raw = price/2000;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw/p;
  let nf; if (f<1.5) nf=1; else if (f<3) nf=2; else if (f<7) nf=5; else nf=10;
  return nf*p;
}
function setTickSize(tick){
  if (!isFinite(tick) || tick<=0) return;
  DE.tickSize = tick;
  const inp = $('tickInput'); if (inp) inp.value = tickToPlainString(tick);
}
// input[type=number] (và String() mặc định của JS) tự chuyển số rất nhỏ sang dạng khoa học (1e-7),
// khó đọc với người dùng — luôn hiện dạng thập phân đầy đủ cho ô Tick.
function tickToPlainString(t){
  if (!isFinite(t) || t===0) return String(t);
  if (Math.abs(t)>=0.0001) return String(t);
  return t.toFixed(Math.min(20, Math.max(0, -Math.floor(Math.log10(Math.abs(t)))+2)));
}

const KLINE_INTERVAL_MAP = {60000:'Min1', 300000:'Min5', 900000:'Min15'};

async function backfill(mySession){
  const now = Date.now();
  const fsym = toFuturesSymbol(DE.symbol);
  const intervalStr = KLINE_INTERVAL_MAP[DE.intervalMs] || 'Min5';
  const desiredStart = now - DE.intervalMs*DE.historyCandles;
  const startSec = Math.floor(desiredStart/1000);
  const endSec = Math.floor(now/1000);

  DE.onStatus('Đang tải lịch sử (kline Futures)…','loading'); DE.onProgress(15);

  let klineRes;
  try{
    // Futures kline trả tối đa 2000 điểm/request — historyCandles tối đa hiện có (1000) luôn nằm
    // gọn trong 1 request duy nhất, không cần chia cửa sổ/nhiều request như cách cũ nữa.
    klineRes = await fetchJson(`/api/mexc/contractKline?symbol=${fsym}&interval=${intervalStr}&start=${startSec}&end=${endSec}`, 12000);
  }catch(e){
    console.error('[backfill] tải kline Futures thất bại:', e);
    DE.restAvailable=false;
    DE.onBanner('Không tải được nến lịch sử từ MEXC Futures (mạng/CORS/backend). Chart sẽ bắt đầu từ dữ liệu realtime ngay khi WebSocket kết nối được.');
    DE.backfillDone=true; DE.onProgress(null); DE.onStatus('Mất kết nối','loading');
    return;
  }
  if (DE.session!==mySession) return;

  const d = klineRes && klineRes.data;
  if (!d || !Array.isArray(d.time) || d.time.length===0){
    console.error('[backfill] kline Futures trả về rỗng/không đúng định dạng:', klineRes);
    DE.onBanner('MEXC Futures không trả về dữ liệu nến cho symbol/khung thời gian này — kiểm tra lại ký hiệu symbol (Futures dùng dạng BTC_USDT).');
    DE.backfillDone=true; DE.onProgress(null); DE.onStatus('LIVE — '+DE.symbol,'live');
    if (DE.onUpdate) DE.onUpdate('candles');
    return;
  }
  DE.onProgress(70);

  const n = d.time.length;
  for (let i=0;i<n;i++){
    const bucketStart = d.time[i]*1000; // API trả giây -> quy đổi ms cho khớp intervalMs
    const c = { start:bucketStart, open:d.open[i], high:d.high[i], low:d.low[i], close:d.close[i], levels:new Map(), totalVol:d.vol[i]||0, volFromKline:true };
    DE.candles.push(c); DE.candleIndex.set(bucketStart, c);
  }
  // Nến CUỐI trong kline có thể vẫn đang chạy (khung hiện tại chưa đóng) — biến nó thành DE.live
  // để lệnh khớp từ WebSocket cộng dồn tiếp đúng vào nến đó thay vì tạo nến trùng lặp.
  const nowBucket = Math.floor(now/DE.intervalMs)*DE.intervalMs;
  const lastC = DE.candles[DE.candles.length-1];
  if (lastC && lastC.start===nowBucket){
    DE.candles.pop();
    DE.live = lastC;
  } else {
    DE.live = newCandle(nowBucket, lastC ? lastC.close : parseFloat(d.close[n-1]));
    DE.candleIndex.set(nowBucket, DE.live);
  }

  if (DE.tickAuto){
    const refPrice = DE.live.close || parseFloat(d.close[n-1]);
    setTickSize(suggestTickSize(refPrice));
  }

  // "Mồi" footprint cho nến live bằng vài lệnh khớp gần nhất (nếu MEXC có trả) trong lúc chờ
  // WebSocket kết nối, để không trống hoàn toàn vài giây đầu. Không quan trọng nếu bước này lỗi.
  try{
    const deals = await fetchJson(`/api/mexc/contractDeals?symbol=${fsym}&limit=100`, 6000);
    const rows = deals && deals.data;
    if (Array.isArray(rows) && rows.length){
      const sorted = rows.slice().sort((a,b)=>a.t-b.t);
      for (const dl of sorted){
        const price=parseFloat(dl.p), qty=parseFloat(dl.v), T=dl.t;
        if (!isFinite(price)||!isFinite(qty)||!isFinite(T)) continue;
        const isSellAggressor = Number(dl.T)===2; // 1=buy(taker mua), 2=sell(taker bán) theo docs MEXC Futures
        // Dùng ingestTrade() (không gọi addTrade() trực tiếp nữa) để: (1) chống trùng với lệnh khớp
        // WS đến ngay sau đó, (2) khối lượng nến hiện tại (đã có totalVol từ Kline) không bị cộng
        // dồn 2 lần — xem applyLiveCandle()/candleVolume() ở trên.
        ingestTrade(price, qty, isSellAggressor, T);
      }
      if (sorted.length) DE.liveStartTime = Math.floor(normalizeTradeTime(sorted[0].t)/DE.intervalMs)*DE.intervalMs;
    }
  }catch(e){ console.error('[backfill] tải mồi deals thất bại (bỏ qua, không ảnh hưởng nến/giá):', e); }

  DE.restAvailable=true; DE.onBanner(null);
  DE.backfillDone=true; DE.onProgress(null);
  DE.onStatus('LIVE — '+DE.symbol,'live');
  if (DE.onUpdate) DE.onUpdate('candles');
}

function stopWs(){
  if (DE.wsPingTimer){ clearInterval(DE.wsPingTimer); DE.wsPingTimer=null; }
  if (DE.wsReconnectTimer){ clearTimeout(DE.wsReconnectTimer); DE.wsReconnectTimer=null; }
  if (DE.ws){ try{ DE.ws.onclose=null; DE.ws.onerror=null; DE.ws.close(); }catch(e){} DE.ws=null; }
}
function scheduleWsReconnect(mySession){
  if (DE.wsReconnectTimer) return;
  DE.wsReconnectTimer = setTimeout(()=>{ DE.wsReconnectTimer=null; if (DE.session===mySession) connectFuturesWs(mySession); }, 3000);
}
// Kết nối thẳng tới WebSocket public của MEXC Futures — KHÔNG cần qua backend proxy như REST,
// vì WebSocket không bị chặn bởi CORS (khác XHR/fetch). Kênh "push.deal" trả JSON thuần (khác
// Spot dùng Protobuf nhị phân), nên không cần thư viện giải mã protobuf nào cả.
function connectFuturesWs(mySession){
  stopWs();
  const fsym = toFuturesSymbol(DE.symbol);
  let ws;
  try{ ws = new WebSocket(FUTURES_WS_URL); }
  catch(e){ console.error('[ws] không tạo được WebSocket:', e); scheduleWsReconnect(mySession); return; }
  DE.ws = ws;
  let loggedSample = false;
  ws.onopen = () => {
    if (DE.session!==mySession) return;
    try{ ws.send(JSON.stringify({method:'sub.deal', param:{symbol:fsym}})); }catch(e){}
    DE.wsPingTimer = setInterval(()=>{ try{ ws.send(JSON.stringify({method:'ping'})); }catch(e){} }, 15000);
    if (DE.backfillDone) DE.onStatus('LIVE — '+DE.symbol, 'live');
  };
  ws.onmessage = (ev) => {
    if (DE.session!==mySession) return;
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if (!loggedSample){
      // In ra 1 lần message đầu tiên để dễ đối chiếu tên field thật của push.deal nếu MEXC có
      // thay đổi so với tài liệu (p/v/T/t) — không ảnh hưởng gì tới hoạt động của chart.
      console.log('[DIAG ws] mẫu message đầu tiên:', ev.data.slice(0,500));
      loggedSample = true;
    }
    if (!msg || msg.channel!=='push.deal' || !msg.data) return; // bỏ qua pong/rs.sub.deal xác nhận/kênh khác
    const rows = Array.isArray(msg.data) ? msg.data : [msg.data];
    let added=false;
    for (const dl of rows){
      if (!dl) continue;
      const price = parseFloat(dl.p);
      const qty = parseFloat(dl.v);
      const rawT = isFinite(dl.t) ? dl.t : Date.now();
      if (!isFinite(price) || !isFinite(qty)) continue;
      const isSellAggressor = Number(dl.T)===2; // 1=buy, 2=sell theo docs MEXC Futures
      if (!DE.liveStartTime) DE.liveStartTime = Math.floor(normalizeTradeTime(rawT)/DE.intervalMs)*DE.intervalMs;
      // ingestTrade() tự chống trùng (vd. lệnh khớp vừa được "mồi" qua REST rồi WS gửi lại) và tự
      // tăng DE.tradeCount — không cộng dồn thủ công ở đây nữa để tránh đếm 2 lần.
      if (ingestTrade(price, qty, isSellAggressor, rawT)) added = true;
    }
    if (added){
      DE.onStatus('LIVE — '+DE.symbol,'live');
      if (DE.onUpdate) DE.onUpdate('candles');
    }
  };
  ws.onerror = (e) => { if (DE.session!==mySession) return; console.error('[ws] lỗi WebSocket Futures:', e); };
  ws.onclose = () => {
    if (DE.session!==mySession) return;
    DE.onStatus('Mất kết nối — đang thử lại…','loading');
    scheduleWsReconnect(mySession);
  };
}

async function startPipeline(){
  DE.session++; const mySession=DE.session;
  DE.onBanner(null); DE.onStatus('Đang kết nối…','loading');
  if (DE.onUpdate) DE.onUpdate('reset');
  stopWs();
  resetModel();
  DE.tickAuto = true;
  await backfill(mySession);
  if (DE.session===mySession) connectFuturesWs(mySession);
  if (DE.session===mySession && DE.onUpdate) DE.onUpdate('ready');
}

/* =========================================================================================
   3. CHART ENGINE — canvas viewport, coordinate transforms, rendering, interaction
   ========================================================================================= */
const $ = id=>document.getElementById(id);
const host=$('chartHost'), canvas=$('chartCanvas'), ctx=canvas.getContext('2d'), tooltip=$('tooltip'), emptyMsg=$('emptyMsg');

const view = {
  pxPerCandle: 64,
  rightIndex: 0,
  dragging:false, dragStartX:0, dragStartRight:0,
  priceZoomDragging:false, priceDragStartY:0, priceDragStartRange:null,
  manualPrice:null,       // {lo,hi} once user manually pans/zooms price axis; null = auto-fit
  mouseX:null, mouseY:null,
  dirty:true,
  fitPending:true,
  // followLive: true = tự trượt khung nhìn theo mỗi khi có nến live mới (mặc định, giống chart
  // sàn thật). Tắt ngay khi người dùng tự tay kéo/zoom trục thời gian (để không "giật" khung nhìn
  // đang xem lịch sử của họ); bật lại khi bấm Fit hoặc load lại/đổi symbol/TF.
  followLive:true,
  lastCsLen:0,            // số nến (candles+live) ở lần vẽ trước, để phát hiện có nến MỚI vừa thêm vào
};
const indicators = {
  footprint:true, volume:false,
};

/* ---------------- Drawing tools (Trend Line / Horizontal Line / Line / Rectangle / Brush) ---------------- */
let activeTool = null;   // 'trend' | 'hline' | 'line' | 'rect' | 'brush' | null
let drawDraft = null;    // in-progress shape while dragging
const drawings = [];     // finished shapes, in chart-space coords {index, price} so they pan/zoom correctly
let selectedIdx = null;  // index into drawings[] currently selected (shows lock/delete menu)
let moveState = null;    // {idx, mode:'move'|'p1'|'p2'|'anchor', startIdx, startPrice, orig} while dragging an existing shape

const MARGIN_RIGHT=66, MARGIN_TOP=8, MARGIN_BOTTOM=22, SUBPANE_H=100, GAP=3;

function allCandles(){ return DE.live ? [...DE.candles, DE.live] : [...DE.candles]; }

function dpr(){ return window.devicePixelRatio||1; }
function resizeCanvas(){
  // Với CSS zoom (khác transform), getBoundingClientRect() và offsetX/Y của chuột vốn đã cùng
  // một hệ toạ độ (đều "hậu-zoom") nên không cần bù/quy đổi gì thêm — code đơn giản, luôn khớp.
  const r = host.getBoundingClientRect();
  canvas.style.width = r.width+'px';
  canvas.style.height = r.height+'px';
  canvas.width = Math.round(r.width*dpr()); canvas.height = Math.round(r.height*dpr());
  view.dirty=true;
}
new ResizeObserver(resizeCanvas).observe(host);

function layout(){
  const W = canvas.width/dpr(), H = canvas.height/dpr();
  const subKeys = indicators.volume ? ['volume'] : [];
  const subTotal = subKeys.length*(SUBPANE_H+GAP);
  const mainH = Math.max(160, H-MARGIN_TOP-MARGIN_BOTTOM-subTotal);
  const panes = { main:{top:MARGIN_TOP, height:mainH} };
  let y = MARGIN_TOP+mainH+GAP;
  for (const k of subKeys){ panes[k]={top:y,height:SUBPANE_H}; y+=SUBPANE_H+GAP; }
  return { W,H, plotRight:W-MARGIN_RIGHT-8, panes, subKeys };
}

function fitView(){
  const cs = allCandles();
  if (cs.length===0) return;
  view.pxPerCandle = 64;
  view.rightIndex = cs.length-1+2;
  view.manualPrice = null;
  view.fitPending=false; view.dirty=true;
  view.followLive = true; view.lastCsLen = cs.length; // Fit = quay lại theo dõi live từ mép phải
}

function ensureManualPrice(L){
  if (view.manualPrice) return;
  const cs = allCandles();
  if (cs.length===0){ view.manualPrice = {lo:0,hi:1}; return; }
  const leftIdx = view.rightIndex - (L.plotRight)/view.pxPerCandle;
  view.manualPrice = priceRangeForVisible(cs, leftIdx, view.rightIndex);
}

function xOfIndex(index, L){ return L.plotRight - (view.rightIndex-index)*view.pxPerCandle; }
function indexOfX(x, L){ return view.rightIndex - (L.plotRight-x)/view.pxPerCandle; }

function priceRangeForVisible(cs, leftIdx, rightIdx){
  let lo=Infinity, hi=-Infinity;
  const a=Math.max(0,Math.floor(leftIdx)), b=Math.min(cs.length-1, Math.ceil(rightIdx));
  for (let i=a;i<=b;i++){ if (!cs[i]) continue; lo=Math.min(lo,cs[i].low); hi=Math.max(hi,cs[i].high); }
  if (!isFinite(lo)){ lo=0; hi=1; }
  if (lo===hi){ lo-=1; hi+=1; }
  const pad=(hi-lo)*0.08;
  return {lo:lo-pad, hi:hi+pad};
}

// Tính số chữ số thập phân cần hiển thị theo tick size. KHÔNG ép tick thành chuỗi rồi đếm sau dấu
// chấm — với tick rất nhỏ (meme coin, vd 0.0000005) JS tự chuyển sang ký hiệu khoa học "5e-7" khiến
// cách đếm cũ ra sai (mất hết độ chính xác, hiện thành "0"). Dùng log10 để luôn đúng bất kể độ lớn.
function decimalsForTick(tick){
  if (!isFinite(tick) || tick<=0) return 2;
  if (tick>=1){
    const s = String(tick);
    return s.includes('.') ? Math.min(s.split('.')[1].length, 8) : 0;
  }
  const d = Math.ceil(-Math.log10(tick));
  return Math.min(Math.max(d,0)+2, 12);
}
function fmtPriceD(p, tick){
  return Number(p).toFixed(decimalsForTick(tick));
}
function fmtVol(v){
  if (v===undefined||v===null) return '';
  const av=Math.abs(v), sign=v<0?'-':'';
  if (av>=1000) return sign+(av/1000).toFixed(2)+'k';
  if (av>=1) return sign+av.toFixed(2);
  return sign+av.toFixed(4);
}
function fmtTime(ms){ const d=new Date(ms); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
// Money volume = price × qty (giá trị $ thực sự khớp lệnh ở mức giá đó), không phải ước tính.
function fmtMoney(v){
  if (v===undefined||v===null) return '';
  const av=Math.abs(v), sign=v<0?'-':'';
  if (av>=1e6) return sign+'$'+(av/1e6).toFixed(2)+'M';
  if (av>=1e3) return sign+'$'+(av/1e3).toFixed(2)+'k';
  return sign+'$'+av.toFixed(2);
}

function visibleRangeIdx(cs, leftIdx){
  return { a: Math.max(0, Math.floor(leftIdx)), b: Math.min(cs.length-1, Math.ceil(view.rightIndex)) };
}

// Bảng màu canvas — đọc lại từ CSS variables mỗi khi vẽ, để đổi được sáng/tối tức thời
let PAL = {};
function refreshPalette(){
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  PAL = {
    bg:g('--bg'), dim:g('--dim'), line:g('--line'), text:g('--text'),
    buy:g('--buy'), sell:g('--sell'), accent:g('--accent'), poc:g('--poc'), warn:g('--warn'),
    grid:g('--grid'), wick:g('--wick'), cellborder:g('--cellborder'), activeText:g('--active-text'),
  };
}

// Quy đổi index-nến/giá <-> toạ độ canvas dùng chung cho cả vẽ chart (draw) lẫn tương tác chuột
// (đặt trend line, horizontal line, v.v.) — để 2 bên luôn khớp nhau tuyệt đối.
function getPriceScale(L){
  const cs = allCandles();
  const leftIdx = view.rightIndex - (L.plotRight)/view.pxPerCandle;
  let lo, hi;
  if (view.manualPrice){ lo=view.manualPrice.lo; hi=view.manualPrice.hi; }
  else { ({lo,hi} = priceRangeForVisible(cs, leftIdx, view.rightIndex)); }
  return {
    lo, hi,
    priceToY: p => L.panes.main.top + (hi-p)/(hi-lo)*L.panes.main.height,
    yToPrice: y => hi - (y-L.panes.main.top)/L.panes.main.height*(hi-lo),
  };
}

function draw(){
  if (!view.dirty) return;
  view.dirty=false;
  refreshPalette();
  const cs = allCandles();
  updateStatsBar(cs);
  const L = layout();
  ctx.setTransform(dpr(),0,0,dpr(),0,0);
  ctx.clearRect(0,0,L.W,L.H);
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0,0,L.W,L.H);

  if (cs.length===0){ emptyMsg.style.display='flex'; view.lastCsLen=0; return; }
  emptyMsg.style.display='none';

  if (view.fitPending){
    fitView();
  } else if (view.followLive && cs.length>view.lastCsLen){
    // Có (các) nến mới vừa được thêm vào (live vừa "chốt" sang khung thời gian mới) trong khi
    // người dùng đang theo dõi live (chưa tự kéo/zoom ra khỏi mép phải). Trước đây rightIndex
    // đứng yên nên nến mới bị vẽ lọt RA NGOÀI mép phải (bị clip, coi như vô hình) — chart trông
    // như đứng hình, không "chạy" theo thời gian thực. Giờ trượt rightIndex đúng bằng số nến mới
    // để mép phải luôn bám theo nến mới nhất, giữ nguyên mức zoom hiện tại.
    view.rightIndex += (cs.length - view.lastCsLen);
  }
  view.lastCsLen = cs.length;
  const leftIdx = view.rightIndex - (L.plotRight)/view.pxPerCandle;
  const scale = getPriceScale(L);
  const {lo, hi, priceToY, yToPrice} = scale;

  drawMainGrid(L, lo, hi, priceToY);

  // Chặn cứng mọi thứ vẽ trong pane chính (nến/footprint) không được tràn ra ngoài khung —
  // dù layout/zoom có lệch kiểu gì thì cũng luôn bị "cắt" gọn đúng biên plotRight/pane.height.
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, L.panes.main.top, L.plotRight, L.panes.main.height);
  ctx.clip();
  drawCandlesAndFootprint(L, cs, leftIdx, priceToY);
  drawUserDrawings(L, scale, selectedIdx);
  ctx.restore();

  if (indicators.volume){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, L.panes.volume.top, L.plotRight, L.panes.volume.height);
    ctx.clip();
    drawVolumePane(L, cs, leftIdx);
    ctx.restore();
  }

  drawTimeAxis(L, cs, leftIdx);
  drawCrosshair(L, cs, leftIdx, priceToY, yToPrice, lo, hi);
}

function drawMainGrid(L, lo, hi, priceToY){
  const p = L.panes.main;
  ctx.strokeStyle = PAL.grid; ctx.lineWidth=1;
  const steps=6;
  ctx.fillStyle=PAL.dim; ctx.font='10px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
  for (let i=0;i<=steps;i++){
    const price = hi - (hi-lo)*i/steps;
    const y = priceToY(price);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(L.plotRight,y); ctx.stroke();
    ctx.fillText(fmtPriceD(price, DE.tickSize), L.plotRight+6, y);
  }
  ctx.strokeStyle=PAL.line; ctx.strokeRect(0.5,p.top+0.5,L.plotRight,p.height);
}
function drawCandlesAndFootprint(L, cs, leftIdx, priceToY){
  const {a,b} = visibleRangeIdx(cs, leftIdx);
  const showFootprint = indicators.footprint && view.pxPerCandle>=30;
  for (let i=a;i<=b;i++){
    const c = cs[i]; if (!c) continue;
    const x = xOfIndex(i, L);
    const wCandle = view.pxPerCandle*0.72;
    const yO=priceToY(c.open), yC=priceToY(c.close), yH=priceToY(c.high), yL=priceToY(c.low);
    const up = c.close>=c.open;
    const color = up?PAL.buy:PAL.sell;

    if (!showFootprint){
      ctx.strokeStyle=color; ctx.fillStyle=color;
      ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.lineWidth=1; ctx.stroke();
      const bodyTop=Math.min(yO,yC), bodyH=Math.max(1,Math.abs(yC-yO));
      ctx.fillRect(x-wCandle/2, bodyTop, wCandle, bodyH);
    } else {
      drawFootprintCandle(c, x, priceToY, yH, yL, yO, yC, up, color);
    }
  }
}

function drawFootprintCandle(c, x, priceToY, yH, yL, yO, yC, up, color){
  // Dành riêng 1 dải hẹp bên TRÁI mỗi candle để vẽ nến thật (wick+thân), phần footprint
  // co lại nằm ngay bên phải cây nến — cả 2 luôn hiển thị cùng lúc, không cái nào bị ẩn.
  const candleStripW = Math.max(7, Math.min(14, view.pxPerCandle*0.16));
  const half = Math.max(10, view.pxPerCandle/2 - candleStripW - 3);
  const xCandle = x - half - candleStripW/2 - 3;

  // Nến LỊCH SỬ (dựng từ Kline, đã đóng TRƯỚC khi mở trang) không có bất kỳ lệnh khớp thật nào
  // -> c.levels rỗng -> không có gì để chia bid/ask theo từng mức giá (giới hạn thật của MEXC
  // Futures: không có endpoint lấy lệnh khớp sâu quá 100 lệnh gần nhất). Trước đây trường hợp
  // này bị vẽ khung footprint TRỐNG TRƠN, nhìn như lỗi/thiếu dữ liệu. Giờ vẫn vẽ khung + nến như
  // cũ, nhưng chèn thêm tổng khối lượng (lấy từ Kline, luôn đúng) ở giữa khung kèm nhãn "no FP"
  // để phân biệt rõ: đây là "chưa có dữ liệu chia theo mức giá", KHÔNG PHẢI số liệu sai.
  if (c.levels.size===0){
    const topY=Math.min(yH,yL), botY=Math.max(yH,yL);
    ctx.strokeStyle=color; ctx.lineWidth=1; ctx.setLineDash([2,2]);
    ctx.strokeRect(x-half+0.5, topY+0.5, half*2-1, Math.max(2,botY-topY-1));
    ctx.setLineDash([]);
    const {total} = candleVolume(c);
    const midY=(topY+botY)/2;
    const rowPx2 = Math.abs(priceToY(0)-priceToY(DE.tickSize));
    if (rowPx2>=13 && half>18){
      const fpx=Math.round(Math.max(9,Math.min(13,rowPx2*0.4)));
      ctx.font=`${fpx}px monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=PAL.dim;
      ctx.fillText('Vol '+fmtVol(total), x, midY-fpx*0.6);
      ctx.font=`${Math.max(7,fpx-3)}px monospace`;
      ctx.fillText('(no FP)', x, midY+fpx*0.6);
    }
    // Vẫn vẽ cây nến thật bên dải trái như bình thường rồi return sớm — không cần chạy phần
    // tính toán/vẽ theo từng mức giá bên dưới vì không có gì trong levels.
    const bodyW = Math.max(4, candleStripW-2);
    ctx.strokeStyle=color; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xCandle,yH); ctx.lineTo(xCandle,yL); ctx.stroke();
    ctx.fillStyle=color;
    const bodyTop2=Math.min(yO,yC), bodyH2=Math.max(1.5,Math.abs(yC-yO));
    ctx.fillRect(xCandle-bodyW/2, bodyTop2, bodyW, bodyH2);
    return;
  }

  let maxLevelVol=0, pocLevel=null, maxBid=0, maxAsk=0;
  for (const [lvl,rec] of c.levels){
    const t=rec.bid+rec.ask; if (t>maxLevelVol){ maxLevelVol=t; pocLevel=lvl; }
    if (rec.bid>maxBid) maxBid=rec.bid;
    if (rec.ask>maxAsk) maxAsk=rec.ask;
  }
  const rowPx = Math.abs(priceToY(0)-priceToY(DE.tickSize));
  const showText = rowPx>=13;
  const fontPx = Math.round(Math.max(9, Math.min(15, rowPx*0.45)));
  // Khối lượng tiền ($) luôn đi kèm khối lượng lệnh — không có công tắc bật/tắt riêng —
  // hiển thị gọn thành một dòng nhỏ ngay dưới số lệnh, chỉ khi hàng đủ cao để không đè chữ.
  const showMoney = rowPx>=22;
  const moneyFontPx = Math.max(6, Math.round(fontPx*0.6));
  const maxTextW = half-4; // số phải nằm gọn trong nửa ô, không tràn ra ngoài khung

  // vẽ chữ căn phải/trái nhưng tự co font nếu quá rộng so với ô, để không bao giờ tràn khung
  function fitText(text, edgeX, align, baseFontPx, bold){
    let fpx = baseFontPx;
    ctx.textAlign = align;
    while (fpx > 6){
      ctx.font = `${bold?'bold ':''}${fpx}px monospace`;
      if (ctx.measureText(text).width <= maxTextW) break;
      fpx--;
    }
    return fpx;
  }

  // QUAN TRỌNG: trước đây chỉ vẽ các MỨC GIÁ ĐÃ CÓ LỆNH KHỚP (c.levels) — nếu nến chỉ vừa mới
  // bắt đầu ghi nhận lệnh khớp thật (dữ liệu còn thưa, VD sát mốc liveStartTime), levelsArr chỉ
  // có 1-2 mức, khiến khung số bị "co lại" nằm lệch hẳn so với râu nến thật (yH/yL luôn đúng, lấy
  // từ Kline). Giờ dựng đủ MỌI mức giá từ high xuống low theo đúng tickSize hiện tại — mức nào
  // chưa có lệnh khớp thì để ô trống (bid=ask=0) — để khung footprint LUÔN khớp chính xác với
  // râu nến, không bao giờ bị lệch/tách rời nữa.
  const hiLvl = levelKey(c.high), loLvl = levelKey(c.low);
  const nRows = Math.round((hiLvl-loLvl)/DE.tickSize)+1;
  const levelsArr = [];
  if (isFinite(nRows) && nRows>0 && nRows<=4000){
    for (let i=0;i<nRows;i++){
      const lvl = Math.round((hiLvl - i*DE.tickSize)/DE.tickSize)*DE.tickSize;
      levelsArr.push([lvl, c.levels.get(lvl) || {bid:0, ask:0}]);
    }
  } else {
    // an toàn: nến bất thường (tick quá nhỏ so với biên độ) -> fallback về các mức đã có dữ liệu
    for (const e of [...c.levels.entries()].sort((p1,p2)=>p2[0]-p1[0])) levelsArr.push(e);
  }
  ctx.textBaseline='middle';

  // stacked-imbalance detection: >=3 consecutive price levels where one side is >=3x the other
  const imbDir=new Map();
  for (const [lvl,rec] of levelsArr){
    if (rec.bid>0&&rec.ask>0&&rec.bid>=rec.ask*3) imbDir.set(lvl,'bid');
    else if (rec.bid>0&&rec.ask>0&&rec.ask>=rec.bid*3) imbDir.set(lvl,'ask');
    else imbDir.set(lvl,null);
  }
  const stacked=new Set();
  for (let i=0;i<levelsArr.length;i++){
    const d=imbDir.get(levelsArr[i][0]);
    if (!d) continue;
    let len=1; for (let j=i+1;j<levelsArr.length;j++){ if (imbDir.get(levelsArr[j][0])===d) len++; else break; }
    if (len>=3) for (let j=i;j<i+len;j++) stacked.add(levelsArr[j][0]);
  }

  for (const [lvl,rec] of levelsArr){
    const y = priceToY(lvl);
    const h = Math.max(rowPx,2);
    const cellTop = y-h/2, cellH = Math.max(1,h-0.5);
    const dir = imbDir.get(lvl);

    // 2 lớp riêng, đúng kiểu ảnh tham chiếu:
    // Lớp 1 (nền ô): mỗi cột Bid/Ask có thang màu HEAT riêng theo % so với max cùng cột trong
    //   candle này (không gộp thành 1 màu/hàng). Bid luôn tông đỏ, Ask luôn tông xanh.
    // Lớp 2 (thanh ngang): độ dài thanh tô = tỉ lệ magnitude, mọc từ vạch chia giữa ra mép ngoài
    //   — vùng còn lại của ô để trắng/trong suốt → tạo đúng hiệu ứng "chỉ tô một phần ô".
    const bidRatio = maxBid? rec.bid/maxBid : 0;
    const askRatio = maxAsk? rec.ask/maxAsk : 0;
    const bidHot = (dir==='bid'&&stacked.has(lvl)) || bidRatio>=0.85;
    const askHot = (dir==='ask'&&stacked.has(lvl)) || askRatio>=0.85;

    // nền ô: lớp phủ mờ (không tô kín tuyệt đối) để lớp Order Book Depth / Liquidation heatmap
    // vẽ trước đó ở dưới vẫn hiện xuyên qua được — chỉ làm tối bớt để số/thanh bid-ask còn đọc rõ.
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x-half, cellTop, half*2, cellH);

    if (rec.bid>0){
      const barW = Math.max(2, half*bidRatio);
      const alpha = bidHot ? 0.9 : (0.15 + bidRatio*0.6);
      ctx.fillStyle = `rgba(226,73,94,${alpha})`;
      ctx.fillRect(x-barW, cellTop, barW, cellH);
    }
    if (rec.ask>0){
      const barW = Math.max(2, half*askRatio);
      const alpha = askHot ? 0.9 : (0.15 + askRatio*0.6);
      ctx.fillStyle = `rgba(47,201,138,${alpha})`;
      ctx.fillRect(x, cellTop, barW, cellH);
    }

    // viền ô nhẹ (lưới) + vạch chia giữa cột bid/ask trong cùng 1 ô
    ctx.strokeStyle=PAL.cellborder; ctx.lineWidth=1;
    ctx.strokeRect(x-half+0.5, cellTop+0.5, half*2-1, cellH-1);
    ctx.beginPath(); ctx.moveTo(x,cellTop); ctx.lineTo(x,cellTop+cellH); ctx.stroke();

    if (lvl===pocLevel){
      // POC = mức giá volume lớn nhất trong candle → tô nền vàng đậm đè lên, không chỉ viền
      ctx.fillStyle='rgba(255,214,10,0.38)';
      ctx.fillRect(x-half+0.5, cellTop+0.5, half*2-1, cellH-1);
      ctx.strokeStyle=PAL.poc; ctx.lineWidth=1.6;
      ctx.strokeRect(x-half+0.5, cellTop+0.5, half*2-1, cellH-1);
    }

    if (showText){
      const qtyY = showMoney ? y-fontPx*0.34 : y;
      if (rec.bid){
        const fpx = fitText(fmtVol(rec.bid), x-3, 'right', fontPx, bidHot);
        ctx.fillStyle = PAL.text;
        ctx.fillText(fmtVol(rec.bid), x-3, qtyY);
        ctx.font = `${fontPx}px monospace`; // reset for measureText baseline elsewhere
      }
      if (rec.ask){
        fitText(fmtVol(rec.ask), x+3, 'left', fontPx, askHot);
        ctx.fillStyle = PAL.text;
        ctx.fillText(fmtVol(rec.ask), x+3, qtyY);
      }

      // khối lượng tiền ($) = giá × khối lượng lệnh — dòng nhỏ gọn ngay dưới, cùng một ô
      if (showMoney){
        const moneyY = y+fontPx*0.62;
        if (rec.bid){
          fitText(fmtMoney(lvl*rec.bid), x-3, 'right', moneyFontPx, true);
          ctx.fillStyle = PAL.text;
          ctx.fillText(fmtMoney(lvl*rec.bid), x-3, moneyY);
        }
        if (rec.ask){
          fitText(fmtMoney(lvl*rec.ask), x+3, 'left', moneyFontPx, true);
          ctx.fillStyle = PAL.text;
          ctx.fillText(fmtMoney(lvl*rec.ask), x+3, moneyY);
        }
      }
    }
  }
  // khung viền ngoài bao trọn cả cột footprint của candle (từ high tới low) — dùng thẳng yH/yL
  // thật của nến (không suy ra từ levelsArr nữa) để LUÔN khớp với râu nến, kể cả khi dữ liệu
  // lệnh khớp còn thưa (nến vừa mới bắt đầu có footprint).
  {
    const topY = Math.min(yH,yL);
    const botY = Math.max(yH,yL);
    ctx.strokeStyle = color; ctx.lineWidth=1.4;
    ctx.strokeRect(x-half+0.5, topY+0.5, half*2-1, botY-topY-1);
  }
  // Cây nến thật (wick + thân) vẽ hẳn trong dải riêng bên TRÁI footprint — luôn hiển thị,
  // không bị footprint đè lên hay ẩn đi.
  const bodyW = Math.max(4, candleStripW-2);
  ctx.strokeStyle=color; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(xCandle,yH); ctx.lineTo(xCandle,yL); ctx.stroke();
  ctx.fillStyle=color;
  const bodyTop=Math.min(yO,yC), bodyH=Math.max(1.5,Math.abs(yC-yO));
  ctx.fillRect(xCandle-bodyW/2, bodyTop, bodyW, bodyH);
}

function subPaneFrame(L, pane, title){
  ctx.strokeStyle=PAL.line; ctx.strokeRect(0.5,pane.top+0.5,L.plotRight,pane.height);
  ctx.fillStyle=PAL.dim; ctx.font='9px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(title, 4, pane.top+3);
}

function drawVolumePane(L, cs, leftIdx){
  const pane=L.panes.volume; subPaneFrame(L,pane,'Buy/Sell Volume (thật, từ taker side)');
  const {a,b}=visibleRangeIdx(cs,leftIdx);
  let maxV=0;
  const bs=[];
  for (let i=a;i<=b;i++){ let buy=0,sell=0; for (const r of cs[i].levels.values()){ buy+=r.ask; sell+=r.bid; } bs[i]={buy,sell}; maxV=Math.max(maxV,buy+sell); }
  if (maxV<=0) maxV=1;
  for (let i=a;i<=b;i++){
    const x=xOfIndex(i,L); const {buy,sell}=bs[i];
    const totH=(buy+sell)/maxV*(pane.height-16);
    const sellH = totH*(sell/(buy+sell||1));
    const buyH = totH-sellH;
    // Bề rộng thanh volume bám theo đúng bề rộng nến thật đang vẽ ở pane chính (không co lại
    // một cách bất hợp lý khi zoom to) — dùng cùng công thức wCandle như nến plain.
    const w = Math.max(2, view.pxPerCandle*0.72);
    ctx.fillStyle=PAL.sell; ctx.fillRect(x-w/2, pane.top+pane.height-3-sellH-buyH, w, sellH);
    ctx.fillStyle=PAL.buy; ctx.fillRect(x-w/2, pane.top+pane.height-3-buyH, w, buyH);
  }
}

function drawUserDrawings(L, scale, selIdx){
  const { priceToY } = scale;
  const items = drawDraft ? [...drawings, drawDraft] : drawings;
  const draftOffset = drawDraft ? drawings.length : -1; // draft (if any) is never "selected"
  items.forEach((d, i) => {
    const isSelected = (i===selIdx && i!==draftOffset);
    if (d.type==='hline'){
      const y = priceToY(d.price);
      const xStart = xOfIndex(d.index, L);
      ctx.save();
      if (isSelected){ ctx.strokeStyle=PAL.accent; ctx.lineWidth=4; ctx.globalAlpha=0.25; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(xStart,y); ctx.lineTo(L.plotRight,y); ctx.stroke(); ctx.globalAlpha=1; }
      ctx.strokeStyle=PAL.accent; ctx.lineWidth=1.3; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(xStart, y); ctx.lineTo(L.plotRight, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=PAL.accent; ctx.beginPath(); ctx.arc(xStart,y,3,0,Math.PI*2); ctx.fill();
      ctx.fillRect(L.plotRight, y-8, 60, 16);
      ctx.fillStyle=PAL.activeText; ctx.font='10px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(fmtPriceD(d.price, DE.tickSize), L.plotRight+4, y);
      if (d.locked){ ctx.fillStyle=PAL.warn; ctx.font='9px monospace'; ctx.fillText('🔒', xStart+6, y-9); }
      ctx.restore();
      return;
    }
    if (d.type==='trend' || d.type==='line'){
      const x1=xOfIndex(d.p1.index,L), y1=priceToY(d.p1.price);
      const x2=xOfIndex(d.p2.index,L), y2=priceToY(d.p2.price);
      ctx.save();
      ctx.lineCap='round';
      const buildPath = ()=>{
        ctx.beginPath();
        if (d.type==='trend'){
          const dx=x2-x1, dy=y2-y1; const len=Math.hypot(dx,dy)||1;
          const ext=4000, ux=dx/len, uy=dy/len;
          ctx.moveTo(x1-ux*ext, y1-uy*ext);
          ctx.lineTo(x2+ux*ext, y2+uy*ext);
        } else { ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); }
      };
      if (isSelected){ ctx.strokeStyle=PAL.accent; ctx.lineWidth=6; ctx.globalAlpha=0.25; buildPath(); ctx.stroke(); ctx.globalAlpha=1; }
      ctx.strokeStyle=PAL.accent; ctx.lineWidth=1.6; buildPath(); ctx.stroke();
      if (d.type==='trend'){
        ctx.fillStyle=PAL.bg; ctx.strokeStyle=PAL.accent; ctx.lineWidth=1.4;
        for (const pt of [{x:x1,y:y1},{x:x2,y:y2}]){
          ctx.beginPath(); ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
        }
      }
      ctx.restore();
      return;
    }
    if (d.type==='rect'){
      const x1=xOfIndex(d.p1.index,L), y1=priceToY(d.p1.price);
      const x2=xOfIndex(d.p2.index,L), y2=priceToY(d.p2.price);
      const rx=Math.min(x1,x2), ry=Math.min(y1,y2), rw=Math.abs(x2-x1), rh=Math.abs(y2-y1);
      ctx.save();
      ctx.fillStyle=PAL.accent; ctx.globalAlpha=0.14; ctx.fillRect(rx,ry,rw,rh);
      ctx.globalAlpha=1; ctx.strokeStyle=PAL.accent; ctx.lineWidth=isSelected?2.6:1.4;
      ctx.strokeRect(rx+0.5,ry+0.5,rw,rh);
      if (isSelected){ ctx.setLineDash([4,3]); ctx.strokeStyle=PAL.text; ctx.lineWidth=1; ctx.strokeRect(rx-4.5,ry-4.5,rw+9,rh+9); ctx.setLineDash([]); }
      ctx.restore();
      return;
    }
    if (d.type==='brush'){
      if (d.points.length<2) return;
      ctx.save();
      const buildPath = ()=>{
        ctx.beginPath();
        d.points.forEach((pt,j)=>{
          const x=xOfIndex(pt.index,L), y=priceToY(pt.price);
          if (j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
      };
      ctx.lineJoin='round'; ctx.lineCap='round';
      if (isSelected){ ctx.strokeStyle=PAL.accent; ctx.lineWidth=6; ctx.globalAlpha=0.25; buildPath(); ctx.stroke(); ctx.globalAlpha=1; }
      ctx.strokeStyle=PAL.accent; ctx.lineWidth=2.2; ctx.globalAlpha=0.9; buildPath(); ctx.stroke();
      ctx.restore();
    }
  });
}

function drawTimeAxis(L, cs, leftIdx){
  const {a,b} = visibleRangeIdx(cs, leftIdx);
  ctx.fillStyle=PAL.dim; ctx.font='9.5px monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
  const step = Math.max(1, Math.round((b-a)/8));
  for (let i=a;i<=b;i+=step){ const x=xOfIndex(i,L); ctx.fillText(fmtTime(cs[i].start), x, L.H-18); }
}

function drawCrosshair(L, cs, leftIdx, priceToY, yToPrice, lo, hi){
  tooltip.style.display='none';
  if (view.mouseX===null || view.dragging){ return; }
  const idx = Math.round(indexOfX(view.mouseX, L));
  const c = cs[idx]; if (!c){ return; }
  const x = xOfIndex(idx, L);
  ctx.strokeStyle='rgba(79,163,255,0.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,MARGIN_TOP); ctx.lineTo(x,L.H-MARGIN_BOTTOM); ctx.stroke();
  if (view.mouseY!==null && view.mouseY>=L.panes.main.top && view.mouseY<=L.panes.main.top+L.panes.main.height){
    ctx.beginPath(); ctx.moveTo(0,view.mouseY); ctx.lineTo(L.plotRight,view.mouseY); ctx.stroke();
    const price = yToPrice(view.mouseY);
    ctx.setLineDash([]); ctx.fillStyle=PAL.accent; ctx.fillRect(L.plotRight,view.mouseY-8,60,16);
    ctx.fillStyle=PAL.activeText; ctx.font='10px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(fmtPriceD(price,DE.tickSize), L.plotRight+4, view.mouseY);
  }
  ctx.setLineDash([]);

  const {buy, sell, total} = candleVolume(c);
  const delta = buy-sell;
  tooltip.innerHTML = `<b>${fmtTime(c.start)}</b><br>
    O <b>${fmtPriceD(c.open,DE.tickSize)}</b> H <b>${fmtPriceD(c.high,DE.tickSize)}</b><br>
    L <b>${fmtPriceD(c.low,DE.tickSize)}</b> C <b>${fmtPriceD(c.close,DE.tickSize)}</b><br>
    Vol <b>${fmtVol(total)}</b> &nbsp; Δ <b style="color:${delta>=0?'var(--buy)':'var(--sell)'}">${(delta>=0?'+':'')+fmtVol(delta)}</b><br>
    <span style="color:var(--sell)">Bid ${fmtVol(sell)}</span> &nbsp; <span style="color:var(--buy)">Ask ${fmtVol(buy)}</span>`;
  const hostRect = host.getBoundingClientRect();
  let left = x+14, top = 10;
  if (left+170>hostRect.width) left = x-184;
  tooltip.style.left=left+'px'; tooltip.style.top=top+'px'; tooltip.style.display='block';
}

function updateStatsBar(cs){
  let buy=0, sell=0;
  for (const c of cs) for (const r of c.levels.values()){ buy+=r.ask; sell+=r.bid; }
  $('stCandles').textContent = cs.length;
  $('stBuy').textContent = fmtVol(buy);
  $('stSell').textContent = fmtVol(sell);
  const net = buy-sell;
  const de = $('stDelta'); de.textContent=(net>=0?'+':'')+fmtVol(net); de.style.color = net>=0?'var(--buy)':'var(--sell)';
  $('stTrades').textContent = DE.tradeCount.toLocaleString();
}

/* ---------------- Footprint Details panel: OHLC/Volume/Delta/CVD/POC/VAH-VAL/Imbalance/Signals ---------------- */
function candleBuySell(c){
  let buy=0, sell=0; for (const r of c.levels.values()){ buy+=r.ask; sell+=r.bid; }
  return {buy, sell, delta:buy-sell};
}
function levelImbalanceDir(rec){
  if (rec.bid>0 && rec.ask>0 && rec.ask>=rec.bid*3) return 'ask';
  if (rec.bid>0 && rec.ask>0 && rec.bid>=rec.ask*3) return 'bid';
  return null;
}
// Value Area (70% volume) quanh POC — chuẩn thống kê Market Profile / Footprint
function valueArea(levelsArr, pocLevel, totalVol){
  if (!levelsArr.length || totalVol<=0) return {vah:pocLevel, val:pocLevel};
  const byLvl = new Map(levelsArr.map(([lvl,rec])=>[lvl, rec.bid+rec.ask]));
  const sorted = [...levelsArr].sort((a,b)=> (b[1].bid+b[1].ask)-(a[1].bid+a[1].ask));
  const included = new Set([pocLevel]);
  let acc = byLvl.get(pocLevel)||0;
  const target = totalVol*0.70;
  for (const [lvl] of sorted){
    if (acc>=target) break;
    if (included.has(lvl)) continue;
    included.add(lvl); acc += byLvl.get(lvl)||0;
  }
  const prices = [...included];
  return { vah: Math.max(...prices), val: Math.min(...prices) };
}
function cumulativeDeltaUpTo(cs, idx){
  let cvd=0;
  for (let i=0;i<=idx;i++) cvd += candleBuySell(cs[i]).delta;
  return cvd;
}
/* ---------------- interaction: pan / zoom / crosshair ---------------- */
function startDrawing(e, L){
  deselectDrawing();
  const scale = getPriceScale(L);
  const idx = indexOfX(e.offsetX, L);
  const price = scale.yToPrice(e.offsetY);
  if (activeTool==='hline'){
    drawings.push({type:'hline', index: idx, price});
    setActiveTool(null);
    view.dirty=true;
    return;
  }
  if (activeTool==='brush'){
    drawDraft = {type:'brush', points:[{index:idx, price}]};
    view.dirty=true;
    return;
  }
  drawDraft = {type:activeTool, p1:{index:idx, price}, p2:{index:idx, price}};
  view.dirty=true;
}

/* ---------------- Chọn / kéo di chuyển / chỉnh đầu mút / khóa / xóa nét vẽ ---------------- */
function distToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq>0 ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
// Tìm nét vẽ dưới con trỏ + xác định đang trỏ vào "thân" (di chuyển cả hình) hay
// vào 1 đầu mút cụ thể (kéo riêng đầu đó để chỉnh lại hình).
function findDrawingHit(x, y, L, scale){
  const TH = 6, HANDLE_TH = 8, priceToY = scale.priceToY;
  for (let i=drawings.length-1; i>=0; i--){
    const d = drawings[i];
    if (d.type==='hline'){
      const sx=xOfIndex(d.index,L), sy=priceToY(d.price);
      if (x>=sx-TH && Math.abs(y-sy)<=TH) return {idx:i, mode:'anchor'};
    } else if (d.type==='trend' || d.type==='line'){
      const x1=xOfIndex(d.p1.index,L), y1=priceToY(d.p1.price);
      const x2=xOfIndex(d.p2.index,L), y2=priceToY(d.p2.price);
      if (Math.hypot(x-x1,y-y1)<=HANDLE_TH) return {idx:i, mode:'p1'};
      if (Math.hypot(x-x2,y-y2)<=HANDLE_TH) return {idx:i, mode:'p2'};
      let onLine;
      if (d.type==='trend'){
        const dx=x2-x1, dy=y2-y1; const len=Math.hypot(dx,dy)||1; const ext=4000, ux=dx/len, uy=dy/len;
        onLine = distToSegment(x,y, x1-ux*ext,y1-uy*ext, x2+ux*ext,y2+uy*ext) <= TH;
      } else {
        onLine = distToSegment(x,y,x1,y1,x2,y2) <= TH;
      }
      if (onLine) return {idx:i, mode:'move'};
    } else if (d.type==='rect'){
      const x1=xOfIndex(d.p1.index,L), y1=priceToY(d.p1.price);
      const x2=xOfIndex(d.p2.index,L), y2=priceToY(d.p2.price);
      if (Math.hypot(x-x1,y-y1)<=HANDLE_TH) return {idx:i, mode:'p1'};
      if (Math.hypot(x-x2,y-y2)<=HANDLE_TH) return {idx:i, mode:'p2'};
      const rx=Math.min(x1,x2), ry=Math.min(y1,y2), rw=Math.abs(x2-x1), rh=Math.abs(y2-y1);
      if (x>=rx-TH && x<=rx+rw+TH && y>=ry-TH && y<=ry+rh+TH) return {idx:i, mode:'move'};
    } else if (d.type==='brush'){
      for (let j=1;j<d.points.length;j++){
        const a=d.points[j-1], b=d.points[j];
        if (distToSegment(x,y, xOfIndex(a.index,L),priceToY(a.price), xOfIndex(b.index,L),priceToY(b.price)) <= TH){
          return {idx:i, mode:'move'};
        }
      }
    }
  }
  return null;
}
function applyMove(ms, idx, price){
  const d = drawings[ms.idx];
  if (!d) return;
  const dIdx = idx-ms.startIdx, dPrice = price-ms.startPrice;
  if (ms.mode==='move'){
    if (d.type==='hline'){ d.index = ms.orig.index+dIdx; d.price = ms.orig.price+dPrice; }
    else if (d.type==='brush'){ d.points = ms.orig.points.map(p=>({index:p.index+dIdx, price:p.price+dPrice})); }
    else { d.p1={index:ms.orig.p1.index+dIdx, price:ms.orig.p1.price+dPrice}; d.p2={index:ms.orig.p2.index+dIdx, price:ms.orig.p2.price+dPrice}; }
  } else if (ms.mode==='p1'){ d.p1 = {index:idx, price:price}; }
  else if (ms.mode==='p2'){ d.p2 = {index:idx, price:price}; }
  else if (ms.mode==='anchor'){ d.index = idx; d.price = price; }
}
function selectDrawing(idx, x, y){
  selectedIdx = idx;
  const menu = $('drawSelectMenu');
  const hostRect = host.getBoundingClientRect();
  let left = x+10, top = y-34;
  if (left+64>hostRect.width) left = x-74;
  if (top<4) top = y+14;
  menu.style.left=left+'px'; menu.style.top=top+'px'; menu.style.display='flex';
  updateSelectMenuUI();
  view.dirty=true;
}
function deselectDrawing(){
  if (selectedIdx===null) return;
  selectedIdx = null;
  $('drawSelectMenu').style.display='none';
  view.dirty=true;
}
function updateSelectMenuUI(){
  if (selectedIdx===null) return;
  const d = drawings[selectedIdx];
  const lockBtn=$('dsmLock'), delBtn=$('dsmDelete');
  lockBtn.textContent = d.locked ? '🔓' : '🔒';
  lockBtn.title = d.locked ? 'Mở khóa' : 'Khóa';
  lockBtn.classList.toggle('locked', !!d.locked);
  delBtn.style.display = d.locked ? 'none' : 'flex';
}

canvas.addEventListener('mousedown', e=>{
  const L = layout();
  if (activeTool && e.offsetX<=L.plotRight){ startDrawing(e, L); return; }

  if (e.offsetX <= L.plotRight){
    const scale = getPriceScale(L);
    const hit = findDrawingHit(e.offsetX, e.offsetY, L, scale);
    if (hit){
      selectDrawing(hit.idx, e.offsetX, e.offsetY);
      if (!drawings[hit.idx].locked){
        moveState = {
          idx: hit.idx, mode: hit.mode,
          startIdx: indexOfX(e.offsetX, L), startPrice: scale.yToPrice(e.offsetY),
          orig: JSON.parse(JSON.stringify(drawings[hit.idx])),
        };
      }
      return;
    }
    deselectDrawing();
  }

  ensureManualPrice(L);
  if (e.offsetX > L.plotRight){
    view.priceZoomDragging = true;
    view.priceDragStartY = e.offsetY;
    view.priceDragStartRange = {...view.manualPrice};
  } else {
    view.dragging=true; view.dragStartX=e.offsetX; view.dragStartRight=view.rightIndex;
    view.priceDragStartY = e.offsetY;
    view.priceDragStartRange = {...view.manualPrice};
    view.followLive = false; // người dùng tự kéo xem lịch sử -> ngừng tự trượt theo live
  }
});
window.addEventListener('mouseup', ()=>{
  view.dragging=false; view.priceZoomDragging=false;
  if (drawDraft){
    if (drawDraft.type==='brush'){ if (drawDraft.points.length>1) drawings.push(drawDraft); }
    else { drawings.push(drawDraft); }
    drawDraft=null;
    setActiveTool(null);
    view.dirty=true;
    return;
  }
  if (moveState){
    const idx = moveState.idx;
    moveState = null;
    if (view.mouseX!==null) selectDrawing(idx, view.mouseX, view.mouseY);
    view.dirty = true;
  }
});
canvas.addEventListener('mousemove', e=>{
  view.mouseX=e.offsetX; view.mouseY=e.offsetY;
  const L = layout();
  if (drawDraft){
    const scale = getPriceScale(L);
    const idx = indexOfX(e.offsetX, L);
    const price = scale.yToPrice(e.offsetY);
    if (drawDraft.type==='brush') drawDraft.points.push({index:idx, price});
    else drawDraft.p2 = {index:idx, price};
    view.dirty=true;
    return;
  }
  if (moveState){
    const scale = getPriceScale(L);
    applyMove(moveState, indexOfX(e.offsetX, L), scale.yToPrice(e.offsetY));
    $('drawSelectMenu').style.display='none';
    view.dirty=true;
    return;
  }
  let hoverHit = null;
  if (!activeTool && e.offsetX<=L.plotRight) hoverHit = findDrawingHit(e.offsetX, e.offsetY, L, getPriceScale(L));
  canvas.style.cursor = activeTool ? 'crosshair' : (hoverHit ? (hoverHit.mode==='move'?'move':'pointer') : ((e.offsetX>L.plotRight) ? 'ns-resize' : (view.dragging?'grabbing':'crosshair')));
  if (view.dragging){
    // free 2D pan: horizontal moves time, vertical moves price range together
    view.rightIndex = view.dragStartRight - (e.offsetX-view.dragStartX)/view.pxPerCandle;
    const dy = e.offsetY - view.priceDragStartY;
    const range = view.priceDragStartRange.hi - view.priceDragStartRange.lo;
    const shift = (dy/L.panes.main.height)*range;
    view.manualPrice = { lo: view.priceDragStartRange.lo+shift, hi: view.priceDragStartRange.hi+shift };
  } else if (view.priceZoomDragging){
    // dragging on the price axis zooms the price scale (drag up = zoom in, drag down = zoom out)
    const dy = e.offsetY - view.priceDragStartY;
    const factor = Math.exp(dy/150);
    const mid = (view.priceDragStartRange.lo+view.priceDragStartRange.hi)/2;
    const halfRange = (view.priceDragStartRange.hi-view.priceDragStartRange.lo)/2*factor;
    view.manualPrice = { lo: mid-halfRange, hi: mid+halfRange };
  }
  view.dirty=true;
});
canvas.addEventListener('mouseleave', ()=>{ view.mouseX=null; view.mouseY=null; view.dirty=true; });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const L = layout();
  if (e.offsetX > L.plotRight){
    // wheel over the price axis zooms price scale around cursor price
    ensureManualPrice(L);
    const factor = e.deltaY<0 ? 0.9 : 1/0.9;
    const mid = (view.manualPrice.lo+view.manualPrice.hi)/2;
    const halfRange = (view.manualPrice.hi-view.manualPrice.lo)/2*factor;
    view.manualPrice = { lo: mid-halfRange, hi: mid+halfRange };
    view.dirty=true;
    return;
  }
  const idxUnderCursor = indexOfX(e.offsetX, L);
  const factor = e.deltaY<0 ? 1.12 : 1/1.12;
  view.pxPerCandle = Math.max(3, Math.min(400, view.pxPerCandle*factor));
  view.rightIndex = idxUnderCursor + (L.plotRight-e.offsetX)/view.pxPerCandle;
  view.followLive = false; // người dùng tự zoom trục thời gian -> ngừng tự trượt theo live
  view.dirty=true;
}, {passive:false});

function loop(){
  // Đồng bộ lại kích thước canvas mỗi frame nếu lệch so với khung chứa thực tế —
  // phòng trường hợp ResizeObserver bỏ lỡ sự kiện (do CSS zoom, font load, reflow trễ...)
  // khiến canvas nhỏ hơn khung hiển thị và để lại khoảng trống trắng thừa bên dưới/bên phải chart.
  const r = host.getBoundingClientRect();
  const wantW = Math.round(r.width*dpr()), wantH = Math.round(r.height*dpr());
  if (canvas.width!==wantW || canvas.height!==wantH) resizeCanvas();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================================================
   4. WIRE UP UI
   ========================================================================================= */
DE.onUpdate = (type)=>{ if (type==='reset'){ view.fitPending=true; view.manualPrice=null; view.followLive=true; view.lastCsLen=0; } view.dirty=true; };
DE.onStatus = (txt, mode)=>{ $('statusText').textContent=txt; $('dot').className=mode||''; };
DE.onBanner = (msg)=>{ const b=$('banner'); if (!msg){ b.style.display='none'; } else { b.style.display='block'; b.textContent='⚠ '+msg; } };
DE.onProgress = (pct)=>{ const w=$('progressWrap'), bar=$('progressBar');
  if (pct===null){ w.style.display='none'; } else { w.style.display='block'; bar.style.width=Math.min(100,pct)+'%'; } };

$('symbolSel').addEventListener('change', ()=>{
  DE.symbol = $('symbolSel').value; startPipeline();
});
$('tfBtns').addEventListener('click', e=>{
  if (e.target.tagName!=='BUTTON') return;
  [...e.target.parentElement.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  DE.intervalMs = parseInt(e.target.dataset.v,10);
  // Đổi khung thời gian LUÔN tải lại kline mới (nến của TF khác không thể suy ra từ TF cũ) —
  // kline Futures là 1 request duy nhất, nhanh, nên không cần "rebuild tại chỗ" như cách cũ nữa.
  startPipeline();
});
$('tickInput').addEventListener('change', ()=>{
  const v=parseFloat($('tickInput').value);
  if (isFinite(v)&&v>0){ DE.tickSize=v; DE.tickAuto=false; rebuildLiveFootprint(); view.dirty=true; }
});
$('histSel').addEventListener('change', ()=>{ DE.historyCandles=parseInt($('histSel').value,10); startPipeline(); });
$('fitBtn').addEventListener('click', ()=>{ view.fitPending=true; view.manualPrice=null; view.dirty=true; });
$('reloadBtn').addEventListener('click', ()=>startPipeline());

/* ---- Toolbar công cụ vẽ (Trend Line / Horizontal Line / Line / Rectangle / Brush) ---- */
function setActiveTool(tool){
  activeTool = tool;
  drawDraft = null;
  moveState = null;
  deselectDrawing();
  document.querySelectorAll('#drawToolbar .dtool[data-tool]').forEach(b=>{
    b.classList.toggle('active', b.dataset.tool===tool);
  });
  view.dirty = true;
}
$('drawToolbar').addEventListener('click', e=>{
  const btn = e.target.closest('.dtool'); if (!btn) return;
  if (btn.id==='clearDrawBtn'){ drawings.length=0; setActiveTool(null); return; }
  const t = btn.dataset.tool;
  setActiveTool(activeTool===t ? null : t);
});
$('dsmLock').addEventListener('click', ()=>{
  if (selectedIdx===null) return;
  drawings[selectedIdx].locked = !drawings[selectedIdx].locked;
  updateSelectMenuUI();
  view.dirty=true;
});
$('dsmDelete').addEventListener('click', ()=>{
  if (selectedIdx===null || drawings[selectedIdx].locked) return;
  drawings.splice(selectedIdx,1);
  deselectDrawing();
});
window.addEventListener('keydown', e=>{ if (e.key==='Escape'){ setActiveTool(null); } });

// Ghi chú: đã bỏ thanh chọn Footprint/Buy-Sell Volume — mặc định luôn dùng Footprint,
// tắt hẳn pane Buy/Sell Volume riêng (xem const indicators ở trên).

/* ---- Giao diện sáng / tối ---- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t==='light' ? '☀️ Sáng' : '🌙 Tối';
  try{ localStorage.setItem('ofc_theme', t); }catch(e){}
  view.dirty=true; draw();
}
function initialTheme(){
  let saved=null;
  try{ saved = localStorage.getItem('ofc_theme'); }catch(e){}
  if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  return saved;
}
$('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='light' ? 'dark' : 'light');
});

resizeCanvas();

applyTheme(initialTheme());
startPipeline();

})();
